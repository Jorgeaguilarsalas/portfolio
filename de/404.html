<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seite nicht gefunden — Jorge Aguilar</title>
<meta name="robots" content="noindex,follow">
<meta name="description" content="Die gesuchte Seite existiert nicht oder wurde verschoben.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{
    --bg:#0B0B0D;
    --fg:#F7F7F8;
    --muted:#B4B4BB;
    --border:#262626;
    --accent:#B8FF3D;
    --accent-fg:#09090B;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    background:var(--bg);color:var(--fg);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none;transition:color .2s ease}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .nav{
    padding:20px 32px;border-bottom:1px solid var(--border);
    background:rgba(11,11,13,0.85);backdrop-filter:blur(8px);flex:none;
  }
  .nav-inner{
    max-width:1320px;margin:0 auto;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
  }
  .nav-brand{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .nav-brand .dot{color:var(--accent)}

  .lang-switch{
    display:inline-flex;align-items:center;flex:none;
    border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;
  }
  .lang-switch a{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);padding:5px 9px;border-radius:999px;line-height:1;
    transition:color .2s ease,background-color .2s ease;
  }
  .lang-switch a:hover{color:var(--fg)}
  .lang-switch a.is-current{background:var(--accent);color:var(--accent-fg)}

  main{
    flex:1;display:flex;align-items:center;
    max-width:1320px;width:100%;margin:0 auto;padding:80px 32px;
  }
  .col{max-width:640px}
  .rule{width:80px;height:4px;background:var(--accent);border-radius:2px;margin-bottom:28px}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin:0 0 20px;
  }
  h1{
    font-size:clamp(38px,7vw,68px);font-weight:900;line-height:1.02;
    letter-spacing:-.03em;margin:0 0 22px;
  }
  .lede{font-size:17px;line-height:1.6;color:var(--muted);margin:0 0 36px}
  .actions{display:flex;flex-wrap:wrap;gap:12px}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 22px;border-radius:999px;font-weight:600;font-size:14px;
  }
  .btn-primary{background:var(--accent);color:var(--accent-fg);transition:transform .2s ease}
  .btn-primary:hover{transform:translateX(3px);color:var(--accent-fg)}
  .btn-secondary{
    border:1px solid var(--border);color:var(--fg);font-weight:500;
    transition:border-color .2s ease,color .2s ease;
  }
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}

  footer{
    flex:none;border-top:1px solid var(--border);padding:22px 32px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);
  }
  .footer-inner{
    max-width:1320px;margin:0 auto;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
  }
  @media (max-width:800px){
    .nav{padding:14px 20px}
    main{padding:56px 20px}
    footer{padding:20px}
  }
  @media (prefers-reduced-motion: reduce){
    a,.btn-primary{transition:none}
  }

  /* Enlaces legales (Impressum, Datenschutz): heredan el gris del footer;
     en lima competirian con el CTA del nav. */
  footer a{color:inherit;text-decoration:none;transition:color .2s ease}
  footer a:hover{color:var(--accent)}

  /* ── ESCALA UNICA DE ESPACIADO Y TIPOGRAFIA ────────────────────────────
     Los resets margin:0 de .lede, .body, .impact, .tags y las listas se
     declaran con la misma especificidad (0,1,0) que las reglas de pila
     (.card > * + *, .sub > * + *) y ganaban por orden: por eso el mismo par
     medía 0px en Nexio y 16px en Wolt, que llevaba un parche propio. Aqui
     cada par se resuelve por ESPECIFICIDAD (0,2,x), no por orden, asi que
     una regla nueva mas abajo no puede volver a romperlo.

     Los contenedores flex espacian con gap; ponerles margen ademas lo
     sumaria, asi que a esos se les ajusta el gap y a los de bloque el
     margen. .card y .pillar-content pasan a bloque para que en todas las
     paginas mande el mismo mecanismo. */
  :root{
    --sp-label:16px;   /* chips o eyebrow -> titulo      */
    --sp-title:8px;    /* titulo -> subtitulo o impacto  */
    --sp-text:16px;    /* impacto -> parrafo, p -> p     */
    --sp-media:24px;   /* texto -> figura o lista        */
    --sp-block:48px;   /* entre bloques                  */
    --lh-title:1.15; --lh-text:1.65; --lh-impact:1.45;
    --ls-display:-.03em; --ls-title:-.02em; --ls-mono:.12em;
  }
  @media (max-width:480px){ :root{--sp-block:40px} }

  /* un solo mecanismo de espaciado vertical */
  .card,.pillar-content{display:block}
  .stack{gap:var(--sp-block)}
  .head{gap:var(--sp-title)}

  /* entre bloques */
  :is(.card,.note,.sub) > :is(p,ul,ol,dl,figure,div,h2,h3,h4,.body,.lede,.impact,.tags) + .sub,
  .sub + .sub,
  main section + section{margin-top:var(--sp-block)}

  /* Un margin-bottom suelto colapsa con el margin-top de la escala y gana el
     mayor, asi que la escala dejaba de mandar (19px en el callout de Alcorte,
     20px bajo el h2 de leadership-framework). El ritmo lo fija una sola
     propiedad: el margen superior del elemento que entra. */
  :is(.card,.sub,.note,.section-head,.pillar-content,.dd,.statement) > :is(p,h1,h2,h3,h4,ul,ol,dl,figure){margin-bottom:0}

  /* base: ritmo de texto */
  :is(.card,.sub,.note,.section-head,.pillar-content,.dd,.statement) > * + :is(p,ul,ol,dl,figure,div,h2,h3,h4,.body,.lede,.impact,.tags){margin-top:var(--sp-text)}

  /* etiqueta -> titulo */
  :is(.card,.sub,.note,.section-head,.pillar-content,.dd,.statement) > :is(.tags,.eyebrow,.kicker,.applied-label,.statement-label) + :is(h1,h2,h3,h4){margin-top:var(--sp-label)}

  /* titulo -> subtitulo o linea de impacto */
  :is(.card,.sub,.note,.section-head,.pillar-content,.dd,.statement) > :is(h1,h2,h3,h4) + :is(.impact,.lede,.role,.subtitle){margin-top:var(--sp-title)}

  /* texto -> figura o lista */
  :is(.card,.sub,.note,.section-head,.pillar-content,.dd,.statement) > :is(p,.impact,.lede,.body,h2,h3,h4,figure,ul,ol,dl,.figbox) + :is(figure,ul,ol,dl,.figbox,.photo-split){margin-top:var(--sp-media)}

  /* tipografia */
  :is(.card,.sub,.note,.section-head,.pillar-content,.dd,.statement,section) :is(h2,h3,h4){line-height:var(--lh-title);letter-spacing:var(--ls-title)}
  .rail h1{letter-spacing:var(--ls-display)}
  :is(.card,.sub,.note,.section-head,.pillar-content,.dd,.statement,section) :is(p,li,figcaption){line-height:var(--lh-text);letter-spacing:normal}
  :is(.card,.sub,.note,.section-head,.pillar-content,.dd,.statement,section) .impact{line-height:var(--lh-impact)}
  :is(.card,.sub,.note,.section-head,.pillar-content,.dd,.statement,section) :is(.eyebrow,.tag,.kicker,.applied-label,.statement-label){letter-spacing:var(--ls-mono)}
  :is(.card,.sub,.note,.section-head,.pillar-content,.dd,.statement,section) figcaption{letter-spacing:.04em}
  /* Auto-ocultar la barra: el estado lo pone /nav.js y aqui solo vive la
     transicion. transform y no top, para que no recalcule layout al animar. */
  .nav{transition:transform .2s ease;will-change:transform;}
  .nav.nav-hidden{transform:translateY(-100%);}
  @media (prefers-reduced-motion:reduce){
    .nav{transition:none;}
  }
</style>
<script src="/consent.js" defer></script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/tab.js" defer></script>
<script src="/nav.js" defer></script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/de/" class="nav-brand">Jorge<span class="dot">.</span>Aguilar</a>
    <div class="lang-switch" role="group" aria-label="Sprache">
      <a href="/" hreflang="en">EN</a>
      <a href="/de/" hreflang="de" class="is-current" aria-current="page">DE</a>
      <a href="/es/" hreflang="es">ES</a>
    </div>
  </div>
</nav>

<main>
  <div class="col">
    <div class="rule"></div>
    <p class="eyebrow">Fehler 404</p>
    <h1>Seite nicht gefunden</h1>
    <p class="lede">Die gesuchte Seite existiert nicht oder wurde verschoben.</p>
    <div class="actions">
      <a href="/de/" class="btn btn-primary">Zurück zum Portfolio <span>&rarr;</span></a>
      <a href="/Jorge_Aguilar_CV.pdf" download class="btn btn-secondary">Lebenslauf &darr;</a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span>&copy; 2026 Jorge Aguilar</span>
    <span>Berlin &middot; EMEA &middot; <a href="/impressum/">Impressum</a> &middot; <a href="/datenschutz/">Datenschutz</a></span>
  </div>
</footer>

</body>
</html>
