name = "portfolio"
main = "worker.js"
compatibility_date = "2024-01-01"

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "404-page"
# Sin esto, un request que coincide con un asset se sirve antes de ejecutar el
# Worker, y el redirect de workers.dev nunca correria para "/" ni para ninguna
# pagina real.
run_worker_first = true

# Sincronizado con Observability activado en el dashboard de Cloudflare. Si
# solo vive en el dashboard, un deploy desde el repo puede sobreescribirlo:
# la config del repo es la fuente de verdad.
[observability.logs]
enabled = true
invocation_logs = true
