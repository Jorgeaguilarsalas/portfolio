<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — Jorge Aguilar</title>
<meta name="robots" content="noindex,follow">
<meta name="description" content="The page you are looking for does not exist, or it has moved.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{
    --bg:#0B0B0D;
    --fg:#F7F7F8;
    --muted:#B4B4BB;
    --border:#303036;
    --accent:#B8FF3D;
    --accent-fg:#09090B;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    background:var(--bg);color:var(--fg);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none;transition:color .2s ease}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .nav{
    padding:20px 32px;border-bottom:1px solid var(--border);
    background:rgba(11,11,13,0.85);backdrop-filter:blur(8px);flex:none;
  }
  .nav-inner{
    max-width:1320px;margin:0 auto;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
  }
  .nav-brand{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .nav-brand .dot{color:var(--accent)}

  .lang-switch{
    display:inline-flex;align-items:center;flex:none;
    border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;
  }
  .lang-switch a{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);padding:5px 9px;border-radius:999px;line-height:1;
    transition:color .2s ease,background-color .2s ease;
  }
  .lang-switch a:hover{color:var(--fg)}
  .lang-switch a.is-current{background:var(--accent);color:var(--accent-fg)}

  main{
    flex:1;display:flex;align-items:center;
    max-width:1320px;width:100%;margin:0 auto;padding:80px 32px;
  }
  .col{max-width:640px}
  .rule{width:80px;height:4px;background:var(--accent);border-radius:2px;margin-bottom:28px}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin:0 0 20px;
  }
  h1{
    font-size:clamp(38px,7vw,68px);font-weight:900;line-height:1.02;
    letter-spacing:-.03em;margin:0 0 22px;
  }
  .lede{font-size:17px;line-height:1.6;color:var(--muted);margin:0 0 36px}
  .actions{display:flex;flex-wrap:wrap;gap:12px}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 22px;border-radius:999px;font-weight:600;font-size:14px;
  }
  .btn-primary{background:var(--accent);color:var(--accent-fg);transition:transform .2s ease}
  .btn-primary:hover{transform:translateX(3px);color:var(--accent-fg)}
  .btn-secondary{
    border:1px solid var(--border);color:var(--fg);font-weight:500;
    transition:border-color .2s ease,color .2s ease;
  }
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}

  footer{
    flex:none;border-top:1px solid var(--border);padding:22px 32px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);
  }
  .footer-inner{
    max-width:1320px;margin:0 auto;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
  }
  @media (max-width:800px){
    .nav{padding:14px 20px}
    main{padding:56px 20px}
    footer{padding:20px}
  }
  @media (prefers-reduced-motion: reduce){
    a,.btn-primary{transition:none}
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">Jorge<span class="dot">.</span>Aguilar</a>
    <div class="lang-switch" role="group" aria-label="Language">
      <a href="/" hreflang="en" class="is-current" aria-current="page">EN</a>
      <a href="/de/" hreflang="de">DE</a>
      <a href="/es/" hreflang="es">ES</a>
    </div>
  </div>
</nav>

<main>
  <div class="col">
    <div class="rule"></div>
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <p class="lede">The page you are looking for does not exist, or it has moved.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Back to portfolio <span>&rarr;</span></a>
      <a href="/Jorge_Aguilar_CV.pdf" download class="btn btn-secondary">Download CV &darr;</a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span>&copy; 2026 Jorge Aguilar</span>
    <span>Berlin &middot; EMEA</span>
  </div>
</footer>

</body>
</html>
